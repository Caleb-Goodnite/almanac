<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Almanac</title>
    <style>
      :root { --paper: #f4f0e8; --ink: #1a1814; --soft: #5c564c; }
      @media (prefers-color-scheme: dark) { :root { --paper: #141210; --ink: #ede6d8; --soft: #a79f90; } }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 17px/1.5 Georgia, serif; }
      main { max-width: 22rem; padding: 2rem; }
      h1 { font-size: 2rem; line-height: 1.1; margin: 0 0 0.75rem; font-weight: 500; }
      p { color: var(--soft); margin: 0 0 1.5rem; font-family: system-ui, sans-serif; }
      button { min-height: 48px; padding: 0 1.5rem; border: 0; border-radius: 3px; background: var(--ink); color: var(--paper); font: 500 1rem system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach Almanac</h1>
      <p>Check your connection and try again. Nothing you have logged is lost.</p>
      <button type="button" onclick="history.length > 1 ? history.back() : location.reload()">Try again</button>
    </main>
  </body>
</html>
